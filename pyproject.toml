[project]
name = "ai-intel-agent"
version = "0.1.0"
description = "Autonomous agent for tech and world news ingestion, enrichment and delivery"
requires-python = ">=3.11"

dependencies = [
    # Phase 1
    "feedparser>=6.0.11",   # parses RSS/Atom feeds (arXiv, blogs, news outlets)
    "requests>=2.32.3",     # HTTP calls to APIs (GitHub, HN, GDELT)
    "python-dotenv>=1.0.1", # loads config/.env into environment variables
    "groq>=1.7.0",
    "chromadb>=1.5.9",
    "discord-py>=2.7.1",
]
